<link href="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">
<script src="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>
<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>

<!DOCTYPE html>
<html>
	<head>
		<title>Chatbot</title>
		<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
		<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css" integrity="sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU" crossorigin="anonymous">
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
		<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css')}}"/>
	</head>
	
	
	<body>
		<div class="container-fluid h-100">
			<div class="row justify-content-center h-100">		
				<div class="col-md-8 col-xl-6 chat">
					<div class="card">
						<div class="card-header msg_head">
							<div class="d-flex bd-highlight">
								<div class="img_cont">
									<img src="{{ url_for('static', filename='image/Robot.jpg') }}" class="rounded-circle user_img">
									<!-- <img src="https://www.prdistribution.com/spirit/uploads/pressreleases/2019/newsreleases/d83341deb75c4c4f6b113f27b1e42cd8-chatbot-florence-already-helps-thousands-of-patients-to-remember-their-medication.png" class="rounded-circle user_img"> -->
									<span class="online_icon"></span>
								</div>
								<div class="user_info">
									<span>Chatbot</span>
									<p>Ask me anything!</p>
								</div>
							</div>
						</div>
						<div id="messageFormeight" class="card-body msg_card_body">
							

                             <!-- Example Questions -->
                            <div id="exampleQuestions" class="example_questions">

                                <p class="example_title">
                                    Try asking:
                                </p>

                                <button
                                    type="button"
                                    class="example_question"
                                    data-question="What is RAG and how does it work?"
                                >
                                    What is RAG and how does it work?
                                </button>

                                <button
                                    type="button"
                                    class="example_question"
                                    data-question="What is the difference between dense and sparse retrieval?"
                                >
                                    What is the difference between dense and sparse retrieval?
                                </button>

                            </div>
							
						</div>
						<div class="card-footer">
							<form id="messageArea" class="input-group">
                                <input type="text" id="text" name="msg" placeholder="Type your message..." autocomplete="off" class="form-control type_msg" required/>
								<div class="input-group-append">
									<button type="submit" id="send" class="input-group-text send_btn"><i class="fas fa-location-arrow"></i></button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
		
		<script>
            $(document).ready(function () {

                $("#messageArea").on("submit", async function (event) {

                    event.preventDefault();

                    const date = new Date();
                    const hour = date.getHours();
                    const minute = date.getMinutes();
                    const str_time = hour + ":" + minute;

                    const rawText = $("#text").val().trim();

                    if (!rawText) {
                        return;
                    }

                    // -----------------------------
                    // Show user message
                    // -----------------------------

                    var userHtml =
                        '<div class="d-flex justify-content-end mb-4">' +
                            '<div class="msg_cotainer_send">' +
                                rawText +
                                '<span class="msg_time_send">' +
                                    str_time +
                                '</span>' +
                            '</div>' +
                            '<div class="img_cont_msg">' +
                                '<img src="https://i.ibb.co/d5b84Xw/Untitled-design.png" ' +
                                'class="rounded-circle user_img_msg">' +
                            '</div>' +
                        '</div>';

                    $("#text").val("");

                    $("#messageFormeight").append(userHtml);

                    // Scroll to bottom
                    $("#messageFormeight").scrollTop(
                        $("#messageFormeight")[0].scrollHeight
                    );


                    // -----------------------------
                    // Create empty bot message
                    // -----------------------------

                    var botHtml =
                        '<div class="d-flex justify-content-start mb-4">' +
                            '<div class="img_cont_msg">' +
                                '<img src="/static/image/Robot.jpg" ' +
                                'class="rounded-circle user_img_msg">' +
                            '</div>' +
                            '<div class="msg_cotainer bot_response">' +
                                '<span class="bot_text"></span>' +
                                '<span class="msg_time">' +
                                    str_time +
                                '</span>' +
                            '</div>' +
                        '</div>';

                    $("#messageFormeight").append(botHtml);


                    // Get the last bot message
                    const botTextElement = $("#messageFormeight .bot_text").last();


                    // -----------------------------
                    // Send request
                    // -----------------------------

                    try {

                        const response = await fetch("/get", {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/x-www-form-urlencoded"
                            },

                            body: new URLSearchParams({
                                msg: rawText
                            })

                        });


                        if (!response.ok) {

                            throw new Error(
                                "Server error: " + response.status
                            );

                        }


                        // -----------------------------
                        // Read streaming response
                        // -----------------------------

                        const reader = response.body.getReader();

                        const decoder = new TextDecoder("utf-8");

                        let fullAnswer = "";


                        while (true) {

                            const { value, done } =
                                await reader.read();

                            if (done) {
                                break;
                            }


                            // Convert bytes to text
                            const chunk =
                                decoder.decode(value, {
                                    stream: true
                                });


                            // Add new chunk
                            fullAnswer += chunk;


                            // Display immediately
                            botTextElement.text(fullAnswer);


                            // Scroll to bottom
                            $("#messageFormeight").scrollTop(
                                $("#messageFormeight")[0].scrollHeight
                            );
                        }


                    } catch (error) {

                        console.error(error);

                        botTextElement.text(
                            "Sorry, something went wrong. Please try again."
                        );

                    }

                });

            });

            $(".example_question").on("click", function () {

                const question = $(this).data("question");

                // Put question into input
                $("#text").val(question);

                // Hide example questions
                $("#exampleQuestions").hide();

                // Automatically submit
                $("#messageArea").submit();

            });
        </script>
        
    </body>
</html>
